<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Toolkit feat. Driix — Cronômetro de Set</title>
  <style>
    :root {
      --bg: #0e0e14;
      --surface: #1a1a26;
      --surface2: #22223a;
      --accent: #7c3aed;
      --accent2: #a855f7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d2d42;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header .back {
      display: inline-block;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      margin-bottom: 1rem;
    }
    header .back:hover { color: var(--accent2); }

    header h1 {
      font-size: 1.9rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    header p { color: var(--muted); font-size: 0.95rem; }

    .container { max-width: 720px; margin: 0 auto; }

    /* CONFIG */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .config-card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 500px) { .config-grid { grid-template-columns: 1fr; } }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input, .field select {
      width: 100%;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.6rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus { border-color: var(--accent); }

    .presets {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .preset-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .preset-btn:hover,
    .preset-btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: #2d1f4a;
    }

    .btn-start {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-start:hover { opacity: 0.85; }

    /* CRONÔMETRO PRINCIPAL */
    .clock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
    }

    .clock-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .clock-display {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.5rem;
      font-variant-numeric: tabular-nums;
      transition: color 0.5s;
    }

    .clock-phase {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* Barra de progresso circular */
    .ring-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 10;
    }

    .ring-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 502;
      stroke-dashoffset: 502;
      transition: stroke-dashoffset 1s linear, stroke 0.5s;
    }

    .ring-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-pct {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
    }

    .ring-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Fases */
    .phases-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .phase-pill {
      padding: 0.3rem 0.85rem;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 2px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
      transition: all 0.3s;
    }

    .phase-pill.active {
      color: var(--bg);
      border-color: transparent;
    }

    /* Alertas */
    .alert-box {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: none;
      animation: pulse 1s ease infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to   { opacity: 0.7; }
    }

    /* Botões de controle */
    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      padding: 0.65rem 1.5rem;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ctrl:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-ctrl.primary:hover { background: var(--accent2); border-color: var(--accent2); }
    .btn-ctrl.danger:hover { border-color: var(--red); color: var(--red); }

    /* Fases detalhadas */
    .phases-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .phases-card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .phase-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.3s;
    }

    .phase-item:last-child { border-bottom: none; }
    .phase-item.done { opacity: 0.4; }
    .phase-item.current { opacity: 1; }

    .phase-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .phase-name { font-weight: 600; flex: 1; }
    .phase-time { font-size: 0.85rem; color: var(--muted); }
    .phase-remaining {
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 70px;
      text-align: right;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    .bottom-nav a {
      color: var(--accent2);
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }
    .bottom-nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <a href="../../" class="back">← DJ Toolkit feat. Driix</a>
  <h1>⏱ Cronômetro de Set</h1>
  <p>Divida seu set em fases, acompanhe o tempo e receba alertas automáticos.</p>
</header>

<div class="container">

  <!-- CONFIG -->
  <div class="config-card" id="config-card">
    <h2>⚙️ Configurar Set</h2>

    <div style="margin-bottom:1rem;">
      <div class="field" style="margin-bottom:0.5rem;">
        <label>Duração total do set</label>
      </div>
      <div class="presets">
        <button class="preset-btn" onclick="setPreset(30)">30 min</button>
        <button class="preset-btn active" onclick="setPreset(60)">1 hora</button>
        <button class="preset-btn" onclick="setPreset(90)">1h30</button>
        <button class="preset-btn" onclick="setPreset(120)">2 horas</button>
        <button class="preset-btn" onclick="setPreset(180)">3 horas</button>
      </div>
      <div class="config-grid">
        <div class="field">
          <label>Duração total (min)</label>
          <input type="number" id="total-min" value="60" min="10" max="360" />
        </div>
        <div class="field">
          <label>Alerta antes de cada fase (min)</label>
          <input type="number" id="alert-min" value="2" min="1" max="10" />
        </div>
      </div>
    </div>

    <div style="margin-bottom:1rem;">
      <div class="field" style="margin-bottom:0.5rem;">
        <label>Divisão de fases (%)</label>
      </div>
      <div class="config-grid">
        <div class="field">
          <label>🌅 Abertura</label>
          <input type="number" id="pct-abertura" value="20" min="5" max="50" />
        </div>
        <div class="field">
          <label>🔥 Aquecimento</label>
          <input type="number" id="pct-aquecimento" value="30" min="5" max="50" />
        </div>
        <div class="field">
          <label>⚡ Pico</label>
          <input type="number" id="pct-pico" value="30" min="5" max="50" />
        </div>
        <div class="field">
          <label>🌙 Fechamento</label>
          <input type="number" id="pct-fechamento" value="20" min="5" max="50" />
        </div>
      </div>
    </div>

    <button class="btn-start" onclick="startTimer()">▶ Iniciar Set</button>
  </div>

  <!-- CRONÔMETRO -->
  <div class="clock-card" id="clock-card">
    <div class="clock-label">Tempo decorrido</div>
    <div class="clock-display" id="clock-display">00:00</div>

    <div class="phases-row" id="phases-row"></div>

    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="ring-bg" cx="90" cy="90" r="80" />
        <circle class="ring-fill" id="ring-fill" cx="90" cy="90" r="80" />
      </svg>
      <div class="ring-center">
        <div class="ring-pct" id="ring-pct">0%</div>
        <div class="ring-sub">do set</div>
      </div>
    </div>

    <div class="clock-phase" id="clock-phase">—</div>

    <div class="alert-box" id="alert-box"></div>

    <div class="controls">
      <button class="btn-ctrl primary" id="btn-pause" onclick="togglePause()">⏸ Pausar</button>
      <button class="btn-ctrl" onclick="resetTimer()">↩ Reiniciar</button>
      <button class="btn-ctrl danger" onclick="stopTimer()">⏹ Encerrar</button>
    </div>
  </div>

  <!-- FASES DETALHADAS -->
  <div class="phases-card" id="phases-card">
    <h2>📊 Fases do Set</h2>
    <div id="phases-detail"></div>
  </div>

  <div class="bottom-nav">
    <a href="../setlist/">← Montador de Setlist</a>
    <a href="../../">Hub DJ Toolkit →</a>
  </div>

</div>

<script>
// ── ESTADO ────────────────────────────────────────────────────────────────────
let timerInterval = null;
let elapsed = 0;        // segundos
let totalSec = 0;
let alertSec = 0;
let phases = [];
let paused = false;
let alertsFired = new Set();

const PHASE_COLORS = {
  "Abertura":    { color: "#22c55e",  bg: "#14532d" },
  "Aquecimento": { color: "#eab308",  bg: "#713f12" },
  "Pico":        { color: "#ef4444",  bg: "#7f1d1d" },
  "Fechamento":  { color: "#22d3ee",  bg: "#164e63" }
};

// ── PRESET ────────────────────────────────────────────────────────────────────
function setPreset(min) {
  document.getElementById("total-min").value = min;
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}

// ── INICIAR ───────────────────────────────────────────────────────────────────
function startTimer() {
  const totalMin = parseInt(document.getElementById("total-min").value) || 60;
  alertSec = (parseInt(document.getElementById("alert-min").value) || 2) * 60;
  totalSec = totalMin * 60;

  const pcts = {
    Abertura:    parseInt(document.getElementById("pct-abertura").value) || 20,
    Aquecimento: parseInt(document.getElementById("pct-aquecimento").value) || 30,
    Pico:        parseInt(document.getElementById("pct-pico").value) || 30,
    Fechamento:  parseInt(document.getElementById("pct-fechamento").value) || 20
  };

  // Normaliza para 100%
  const sum = Object.values(pcts).reduce((a,b) => a+b, 0);
  let acc = 0;
  phases = Object.entries(pcts).map(([name, pct]) => {
    const dur = Math.round((pct / sum) * totalSec);
    const start = acc;
    acc += dur;
    return { name, dur, start, end: acc };
  });

  elapsed = 0;
  paused = false;
  alertsFired.clear();

  document.getElementById("config-card").style.display = "none";
  document.getElementById("clock-card").style.display = "block";
  document.getElementById("phases-card").style.display = "block";

  buildPhasePills();
  renderPhasesDetail();
  tick();
  timerInterval = setInterval(tick, 1000);
}

// ── TICK ──────────────────────────────────────────────────────────────────────
function tick() {
  if (paused) return;

  updateDisplay();
  checkAlerts();

  if (elapsed >= totalSec) {
    clearInterval(timerInterval);
    document.getElementById("clock-display").textContent = formatTime(totalSec);
    showAlert("🎉 Set encerrado! Tempo esgotado.", "#22c55e", "#14532d");
    return;
  }

  elapsed++;
}

// ── DISPLAY ───────────────────────────────────────────────────────────────────
function formatTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function currentPhase() {
  return phases.find(p => elapsed >= p.start && elapsed < p.end) || phases[phases.length-1];
}

function updateDisplay() {
  document.getElementById("clock-display").textContent = formatTime(elapsed);

  const pct = Math.min(100, Math.round((elapsed / totalSec) * 100));
  document.getElementById("ring-pct").textContent = pct + "%";

  // Anel
  const circumference = 2 * Math.PI * 80; // ~502
  const offset = circumference - (pct / 100) * circumference;
  const ring = document.getElementById("ring-fill");
  ring.style.strokeDashoffset = offset;

  const phase = currentPhase();
  const pc = PHASE_COLORS[phase.name] || { color: "#a855f7" };
  ring.style.stroke = pc.color;

  // Cor do relógio
  const remaining = totalSec - elapsed;
  document.getElementById("clock-display").style.color =
    remaining <= 60 ? "var(--red)" :
    remaining <= alertSec ? "var(--yellow)" :
    "var(--text)";

  document.getElementById("clock-phase").textContent =
    `${phase.name} · faltam ${formatTime(phase.end - elapsed)}`;
  document.getElementById("clock-phase").style.color = pc.color;

  // Pills
  document.querySelectorAll(".phase-pill").forEach((pill, i) => {
    pill.classList.toggle("active", phases[i].name === phase.name);
    if (phases[i].name === phase.name) {
      pill.style.background = pc.color;
      pill.style.borderColor = pc.color;
    }
  });

  renderPhasesDetail();
}

function buildPhasePills() {
  const row = document.getElementById("phases-row");
  row.innerHTML = phases.map(p => {
    const pc = PHASE_COLORS[p.name] || {};
    return `<div class="phase-pill" style="">${p.name} ${formatTime(p.dur)}</div>`;
  }).join("");
}

function renderPhasesDetail() {
  const phase = currentPhase();
  document.getElementById("phases-detail").innerHTML = phases.map(p => {
    const pc = PHASE_COLORS[p.name] || { color: "#a855f7" };
    const isDone = elapsed >= p.end;
    const isCurrent = p.name === phase.name;
    const remaining = isCurrent ? p.end - elapsed : (isDone ? 0 : p.dur);
    return `
      <div class="phase-item ${isDone ? "done" : isCurrent ? "current" : ""}">
        <div class="phase-dot" style="background:${pc.color}"></div>
        <div class="phase-name">${p.name}</div>
        <div class="phase-time">${formatTime(p.start)} – ${formatTime(p.end)}</div>
        <div class="phase-remaining" style="color:${pc.color}">
          ${isDone ? "✔ concluído" : isCurrent ? `⏱ ${formatTime(remaining)}` : formatTime(p.dur)}
        </div>
      </div>`;
  }).join("");
}

// ── ALERTAS ───────────────────────────────────────────────────────────────────
function checkAlerts() {
  // Alerta antes de cada fase
  phases.forEach(p => {
    const alertAt = p.end - alertSec;
    if (elapsed === alertAt && p.name !== "Fechamento" && !alertsFired.has(p.name)) {
      alertsFired.add(p.name);
      const next = phases[phases.indexOf(p) + 1];
      if (next) showAlert(`⚠️ Faltam ${formatTime(alertSec)} para ${next.name}!`, "var(--yellow)", "#713f12");
    }
  });

  // Último minuto
  if (elapsed === totalSec - 60 && !alertsFired.has("ultimo-minuto")) {
    alertsFired.add("ultimo-minuto");
    showAlert("🔴 Último minuto de set! Prepare o fechamento.", "var(--red)", "#7f1d1d");
  }
}

function showAlert(msg, color, bg) {
  const box = document.getElementById("alert-box");
  box.textContent = msg;
  box.style.display = "block";
  box.style.color = color;
  box.style.background = bg;
  box.style.border = `1px solid ${color}`;
  setTimeout(() => { box.style.display = "none"; }, 6000);
}

// ── CONTROLES ─────────────────────────────────────────────────────────────────
function togglePause() {
  paused = !paused;
  document.getElementById("btn-pause").textContent = paused ? "▶ Retomar" : "⏸ Pausar";
  document.getElementById("btn-pause").style.background = paused ? "#22c55e" : "";
}

function resetTimer() {
  elapsed = 0;
  paused = false;
  alertsFired.clear();
  document.getElementById("btn-pause").textContent = "⏸ Pausar";
  document.getElementById("btn-pause").style.background = "";
  document.getElementById("alert-box").style.display = "none";
  updateDisplay();
}

function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById("clock-card").style.display = "none";
  document.getElementById("phases-card").style.display = "none";
  document.getElementById("config-card").style.display = "block";
  elapsed = 0;
  paused = false;
}
</script>

</body>
</html>
